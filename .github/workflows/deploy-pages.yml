# استقرار خودکار روی GitHub Pages
# آدرس نهایی: https://alimobiny.github.io/Mind-Game/
# مکانیزم: اکشن‌های رسمی گیت‌هاب (بدون شاخهٔ gh-pages، استقرار اتمی آرتیفکت)
#
# ⏸ تریگر push موقتاً غیرفعال است (درخواست کاربر: دیپلوی عقب افتاد).
# برای راه‌اندازی مجدد:
#   ۱) در گیت‌هاب: Settings ← Pages ← Source: «GitHub Actions» (یک‌بار، دستی —
#      توکن Actions اجازهٔ «ساخت» سایت را ندارد؛ خطای «Resource not accessible»)
#   ۲) بلوک push: زیر را از کامنت خارج کنید
name: Deploy to GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

# استقرار‌های هم‌زمان یکدیگر را لغو نکنند؛ فقط آخرین push مهم است
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (با base مخزن)
        run: npm run build
        env:
          DEPLOY_BASE: /Mind-Game/

      # SPA fallback: رفرش/لینک عمیق (مثل /Mind-Game/program) روی Pages به 404 می‌خورد؛
      # کپی index.html با نام 404.html باعث می‌شود اپ بالا بیاید و روتر مسیر را رندر کند
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # نکته: enablement حذف شد — GITHUB_TOKEN در این حساب اجازهٔ «ساخت» سایت
      # Pages را ندارد (Resource not accessible by integration). سایت باید یک‌بار
      # دستی فعال شود: Settings → Pages → Source: GitHub Actions. پس از آن این
      # گام فقط پیکربندی را می‌خواند و deploy-pages کار می‌کند.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
