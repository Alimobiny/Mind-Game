# پیکربندی electron-builder — نسخهٔ دسکتاپ ویندوز
# خروجی: release/ (داخل .gitignore)
#
# فقط NSIS: نصب‌شوندهٔ one-click با میانبر منوی استارت — بدون هیچ پنجرهٔ CMD.
# (هدف portable حذف شد: لانچر پرتابل electron-builder یک فرایند console است
#  و پنجرهٔ CMD کنار اپ باز می‌ماند و گزینهٔ خاموش‌کردنش وجود ندارد.)
appId: io.github.alimobiny.cognitive-training-lab
productName: Cognitive Training Lab
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/**
  - package.json
# آیکون از build/icon.png (تولیدش با scripts/make-icons.mjs) — خود builder آیکو می‌سازد
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  # بعد از نصب خودکار اجرا شود — تجربهٔ «دوبارکلیک و اپ»
  runAfterFinish: true
  shortcutName: Cognitive Training Lab
